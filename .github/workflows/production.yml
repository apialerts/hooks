name: Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build, Test, Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Docker Image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/hooks:${{ github.sha }} -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/hooks:latest .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/hooks:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/hooks:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy hooks \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --region=us-central1 \
            --image=gcr.io/${{ secrets.GCP_PROJECT_ID }}/hooks:${{ github.sha }}
