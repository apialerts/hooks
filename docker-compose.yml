services:
  hooks:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://hooks:hooks@db:5432/hooks?sslmode=disable
      - PORT=8080
      - BASE_URL=http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=hooks
      - POSTGRES_PASSWORD=hooks
      - POSTGRES_DB=hooks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooks"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
